<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>mega brain</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #212121;
            color: white;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #171717;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            margin-bottom: 10px;
        }

        .new-chat,
        .clear-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            background: #222;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .new-chat:hover,
        .clear-btn:hover {
            background: #333;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 130px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
            gap: 15px;
        }

        .avatar {
            width: 35px;
            height: 35px;
            min-width: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #444;
            font-size: 11px;
            font-weight: bold;
        }

        .user .avatar {
            background: #666;
        }

        .message-content {
            flex: 1;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .feedback {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .feedback button {
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 17px;
        }

        .feedback button:hover {
            color: white;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 250px;
            right: 0;
            padding: 15px 20px 20px;
            background: linear-gradient(
                transparent,
                #212121 25%
            );
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: #303030;
            border: 1px solid #555;
            border-radius: 18px;
            display: flex;
            align-items: flex-end;
            padding: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 12px;
            min-height: 45px;
            max-height: 150px;
            font-family: Arial, sans-serif;
        }

        textarea::placeholder {
            color: #999;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .icon-btn:hover {
            background: #444;
        }

        .send-btn {
            background: white;
            color: black;
        }

        .send-btn:hover {
            background: #ddd;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recording {
            background: #d33 !important;
        }

        .welcome {
            max-width: 700px;
            margin: 100px auto;
            text-align: center;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #aaa;
            font-size: 17px;
        }

        .thinking {
            display: flex;
            gap: 5px;
            padding-top: 8px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #aaa;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-6px);
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;
            }

            .welcome h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            🤖 Stupid AI
        </div>

        <button
            id="newChatBtn"
            class="new-chat">
            ＋ New chat
        </button>

        <button
            id="clearBtn"
            class="clear-btn">
            🗑 Clear chat
        </button>

    </aside>


    <main class="main">

        <div class="topbar">
            Stupid AI
        </div>


        <div id="chat">

            <div
                class="welcome"
                id="welcome">

                <h1>
                    How can I help?
                </h1>

                <p>
                    Type a message or press 🎤
                    and talk to your AI.
                </p>

            </div>

        </div>


        <div class="input-area">

            <div class="input-box">

                <button
                    id="micBtn"
                    class="icon-btn"
                    title="Voice input">
                    🎤
                </button>


                <textarea
                    id="messageInput"
                    placeholder="Message My AI..."
                    rows="1"></textarea>


                <button
                    id="sendBtn"
                    class="icon-btn send-btn"
                    title="Send">
                    ↑
                </button>

            </div>

        </div>

    </main>


    <script type="module">

        import {
            pipeline,
            env
        } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";


        env.allowLocalModels = false;


        const chat =
            document.getElementById("chat");

        const input =
            document.getElementById("messageInput");

        const sendBtn =
            document.getElementById("sendBtn");

        const micBtn =
            document.getElementById("micBtn");

        const welcome =
            document.getElementById("welcome");

        const newChatBtn =
            document.getElementById("newChatBtn");

        const clearBtn =
            document.getElementById("clearBtn");


        let messages =
            JSON.parse(
                localStorage.getItem("myAIChat") || "[]"
            );


        let generator = null;

        let recognition = null;

        let isRecording = false;

        let loadingMessageShown = false;


        function saveChat() {

            localStorage.setItem(
                "myAIChat",
                JSON.stringify(messages)
            );

        }


        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        function addMessage(
            role,
            text,
            save = true
        ) {

            if (welcome) {
                welcome.remove();
            }


            const message =
                document.createElement("div");

            message.className =
                "message " + role;


            const avatar =
                document.createElement("div");

            avatar.className =
                "avatar";

            avatar.textContent =
                role === "user"
                    ? "You"
                    : "AI";


            const content =
                document.createElement("div");

            content.className =
                "message-content";

            content.innerHTML =
                escapeHTML(text);


            if (role === "assistant") {

                const feedback =
                    document.createElement("div");

                feedback.className =
                    "feedback";


                const like =
                    document.createElement("button");

                like.textContent = "👍";

                like.onclick =
                    function () {
                        giveFeedback(
                            like,
                            "up"
                        );
                    };


                const dislike =
                    document.createElement("button");

                dislike.textContent = "👎";

                dislike.onclick =
                    function () {
                        giveFeedback(
                            dislike,
                            "down"
                        );
                    };


                const speak =
                    document.createElement("button");

                speak.textContent = "🔊";

                speak.title =
                    "Read answer aloud";

                speak.onclick =
                    function () {
                        speakText(text);
                    };


                feedback.appendChild(like);

                feedback.appendChild(dislike);

                feedback.appendChild(speak);

                content.appendChild(feedback);

            }


            message.appendChild(avatar);

            message.appendChild(content);

            chat.appendChild(message);


            chat.scrollTop =
                chat.scrollHeight;


            if (save) {

                messages.push({
                    role: role,
                    content: text
                });

                saveChat();

            }

        }


        function showThinking() {

            const old =
                document.getElementById(
                    "thinking"
                );

            if (old) {
                old.remove();
            }


            const message =
                document.createElement("div");

            message.className =
                "message";

            message.id =
                "thinking";


            message.innerHTML = `
                <div class="avatar">
                    AI
                </div>

                <div class="message-content">

                    <div class="thinking">

                        <div class="dot"></div>

                        <div class="dot"></div>

                        <div class="dot"></div>

                    </div>

                </div>
            `;


            chat.appendChild(message);

            chat.scrollTop =
                chat.scrollHeight;

        }


        function removeThinking() {

            const thinking =
                document.getElementById(
                    "thinking"
                );

            if (thinking) {
                thinking.remove();
            }

        }


        async function loadAI() {

            if (generator) {
                return generator;
            }


            if (!loadingMessageShown) {

                loadingMessageShown = true;

                addMessage(
                    "assistant",
                    "⏳ Loading my AI model. The first download may take a while...",
                    false
                );

            }


            try {

                generator =
                    await pipeline(
                        "text-generation",
                        "onnx-community/Qwen3-0.6B-ONNX",
                        {
                            device: "webgpu",
                            dtype: "q4f16"
                        }
                    );


                addMessage(
                    "assistant",
                    "✅ AI loaded! Ask me something.",
                    false
                );


                return generator;

            } catch (webgpuError) {

                console.log(
                    "WebGPU unavailable. Trying CPU.",
                    webgpuError
                );


                try {

                    generator =
                        await pipeline(
                            "text-generation",
                            "onnx-community/Qwen3-0.6B-ONNX",
                            {
                                dtype: "q4"
                            }
                        );


                    addMessage(
                        "assistant",
                        "✅ AI loaded using CPU mode!",
                        false
                    );


                    return generator;

                } catch (cpuError) {

                    console.error(cpuError);


                    addMessage(
                        "assistant",
                        "❌ Could not load the AI model. " +
                        cpuError.message,
                        false
                    );


                    throw cpuError;

                }

            }

        }


        async function sendMessage() {

            const text =
                input.value.trim();


            if (
                !text ||
                sendBtn.disabled
            ) {
                return;
            }


            input.value = "";

            sendBtn.disabled = true;


            addMessage(
                "user",
                text
            );


            showThinking();


            try {

                const ai =
                    await loadAI();


                const conversation =
                    messages
                        .slice(-10)
                        .map(
                            function (message) {

                                return {
                                    role: message.role,
                                    content: message.content
                                };

                            }
                        );


                const output =
                    await ai(
                        conversation,
                        {
                            max_new_tokens: 256,
                            do_sample: true,
                            temperature: 0.7
                        }
                    );


                removeThinking();


                const generated =
                    output[0].generated_text;


                let reply = "";


                if (
                    Array.isArray(
                        generated
                    )
                ) {

                    const last =
                        generated[
                            generated.length - 1
                        ];

                    reply =
                        last.content || "";

                } else {

                    reply =
                        String(generated);

                }


                if (!reply.trim()) {

                    reply =
                        "I couldn't generate an answer.";

                }


                addMessage(
                    "assistant",
                    reply
                );


                speakText(reply);


            } catch (error) {

                removeThinking();


                console.error(error);


                addMessage(
                    "assistant",
                    "❌ Error: " +
                    error.message
                );

            } finally {

                sendBtn.disabled = false;

                input.focus();

            }

        }


        function newChat() {

            messages = [];

            localStorage.removeItem(
                "myAIChat"
            );

            location.reload();

        }


        function clearChat() {

            newChat();

        }


        function speakText(text) {

            if (
                !("speechSynthesis" in window)
            ) {
                return;
            }


            speechSynthesis.cancel();


            const voice =
                new SpeechSynthesisUtterance(
                    text
                );


            voice.lang =
                "en-US";

            voice.rate =
                1;

            voice.pitch =
                1;

            voice.volume =
                1;


            const voices =
                speechSynthesis.getVoices();


            const englishVoice =
                voices.find(
                    function (v) {

                        return v.lang
                            .startsWith("en");

                    }
                );


            if (englishVoice) {

                voice.voice =
                    englishVoice;

            }


            speechSynthesis.speak(
                voice
            );

        }


        function giveFeedback(
            button,
            type
        ) {

            const buttons =
                button.parentElement
                    .querySelectorAll(
                        "button"
                    );


            buttons[0].style.opacity =
                type === "up"
                    ? "1"
                    : "0.3";


            buttons[1].style.opacity =
                type === "down"
                    ? "1"
                    : "0.3";


            console.log(
                "Feedback:",
                type
            );

        }


        newChatBtn.addEventListener(
            "click",
            newChat
        );


        clearBtn.addEventListener(
            "click",
            clearChat
        );


        sendBtn.addEventListener(
            "click",
            sendMessage
        );


        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (SpeechRecognition) {

            recognition =
                new SpeechRecognition();


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.lang =
                "en-US";


            recognition.onstart =
                function () {

                    isRecording = true;

                    micBtn.classList.add(
                        "recording"
                    );

                    micBtn.textContent =
                        "⏹";

                };


            recognition.onresult =
                function (event) {

                    const text =
                        event.results[0][0]
                            .transcript;


                    input.value +=
                        (
                            input.value
                                ? " "
                                : ""
                        ) + text;


                    input.focus();

                };


            recognition.onend =
                function () {

                    isRecording = false;

                    micBtn.classList.remove(
                        "recording"
                    );

                    micBtn.textContent =
                        "🎤";

                };


            recognition.onerror =
                function (error) {

                    console.error(
                        "Speech recognition:",
                        error
                    );

                    isRecording = false;

                    micBtn.classList.remove(
                        "recording"
                    );

                    micBtn.textContent =
                        "🎤";

                };


            micBtn.addEventListener(
                "click",
                function () {

                    if (isRecording) {

                        recognition.stop();

                    } else {

                        recognition.start();

                    }

                }
            );


        } else {

            micBtn.disabled = true;

            micBtn.title =
                "Speech recognition is not supported in this browser.";

        }


        messages.forEach(
            function (message) {

                addMessage(
                    message.role,
                    message.content,
                    false
                );

            }
        );


        if (
            "speechSynthesis" in window
        ) {

            speechSynthesis.getVoices();

        }


        loadAI().catch(
            function (error) {

                console.error(
                    "AI loading failed:",
                    error
                );

            }
        );

    </script>

</body>
</html>
